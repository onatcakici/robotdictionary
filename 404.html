<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not in the Dictionary | Robot Dictionary</title>
<meta name="description" content="No entry is recorded at this address. Return to the index of 300 notable robots.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
<style>
:root{
    --paper:#FBFBF9;
    --ink:#1C1E20;
    --soft:#585E63;
    --faint:#A2A69F;
    --rule:#DDDFD9;
    --mark:#C41E2F;
    --display:'Young Serif',Georgia,serif;
    --text:'Source Serif 4',Georgia,serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.62}
  a{color:inherit}
  .page{max-width:1060px;margin:0 auto;padding:0 28px}
  .narrow{max-width:760px;margin:0 auto}
/* frontispiece */
  .front{text-align:center;padding:72px 0 44px}
  .front .rulewide{border:none;border-top:1px solid var(--ink);margin:0 0 40px}
  .front h1{font-family:var(--display);font-size:clamp(38px,6.5vw,58px);font-weight:400}
  .front h1 .dot{color:var(--mark)}
  .front .sub{font-size:16px;color:var(--soft);margin-top:14px;font-variant-caps:all-small-caps;letter-spacing:.14em}
  .front .epigraph{font-style:italic;color:var(--soft);max-width:42ch;margin:24px auto 0;font-size:16px}
  .front .ruledouble{border:none;border-top:3px double var(--ink);margin:44px 0 0}

  .colophon{margin-top:88px;border-top:3px double var(--ink);padding:34px 0 72px;text-align:center}
  .colophon .h{font-family:var(--display);font-size:23px;margin-bottom:8px}
  .colophon p{max-width:46ch;margin:0 auto;color:var(--soft);font-size:15.5px}
  .colophon .mail{display:inline-block;margin-top:14px;font-size:15px;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
  .colophon .mail:hover{color:var(--mark);text-decoration-color:var(--mark)}
  .lost{text-align:center;padding:96px 0 40px}
</style>
</head>
<body>
<div class="page">
  <header class="front narrow">
    <hr class="rulewide">
    <h1>Not in the Dictionary<span class="dot">.</span></h1>
    <div class="sub">No entry at this address</div>
    <p class="epigraph">The page you sought is not recorded here. The name may be misspelled, or the machine may await a later volume.</p>
    <hr class="ruledouble">
  </header>
  <div class="colophon" style="margin-top:40px;border-top:none">
    <div class="h">Return to the index</div>
    <p>Three hundred entries: humanoids, quadrupeds, wheeled machines and rovers.</p>
    <a class="mail" href="/">Robot Dictionary</a>
  </div>
</div>
</body>
</html>
