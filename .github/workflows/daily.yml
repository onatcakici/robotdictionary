name: Daily revision

on:
  schedule:
    - cron: "41 4 * * *"
    # GitHub sometimes delays or drops scheduled runs; the second time only runs if the first did not
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.today.outputs.done }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 40
      - id: today
        run: |
          d=$(date -u +%Y-%m-%d)
          if git log -n 40 --format=%s | grep -qx "Daily revision $d"; then echo "done=1" >> "$GITHUB_OUTPUT"; echo "Already revised on $d"; fi
  revise:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.done != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install picture tools
        run: pip install --quiet pillow scipy "rembg[cpu]==2.0.67"
      - name: Revise entries from sources
        continue-on-error: true
        run: python tools/update.py
      - name: Pictures from Wikimedia Commons
        continue-on-error: true
        run: python tools/images.py
      - name: Cut robots out of new pictures
        continue-on-error: true
        env:
          MAX_CUTOUTS: "25"
        run: python tools/cutouts.py
      - name: Robotics headlines
        continue-on-error: true
        run: python tools/news.py
      - name: Build pages
        run: python tools/build.py
      - name: Publish
        run: |
          git config user.name "Robot Dictionary"
          git config user.email "contact@robotdictionary.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -q -m "Daily revision $(date -u +%Y-%m-%d)"
          git pull --rebase -q || { git rebase --abort; exit 1; }
          git push
      - name: Ask GitHub Pages to rebuild
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
