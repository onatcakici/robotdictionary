name: pipeline-test
on:
  push:
    branches: [data-pipeline-2]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: News
        run: python3 tools/news.py 2>&1 | tee news-log.txt
      - name: Save
        if: always()
        run: |
          git config user.name "onatcakici"
          git config user.email "han2000cc@gmail.com"
          git add -A data/news.json news-log.txt || true
          git commit -q -m "News test" || true
          git push || true
