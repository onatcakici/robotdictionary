name: Build on edit

on:
  push:
    branches: [main]
    paths:
      - "data/entries/**"
      - "tools/**"

permissions:
  contents: write
  pages: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pages
        run: python3 tools/build.py
      - name: Publish
        run: |
          git config user.name "Robot Dictionary"
          git config user.email "contact@robotdictionary.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -q -m "Rebuild pages"
          git pull --rebase -q
          git push
      - name: Ask GitHub Pages to rebuild
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
